name: build-teste
# Compila o APK da branch de teste, disponibiliza como artefato e publica no R2 como CANAL DE TESTE.
# NÃO mexe no app_version.json (produção) nem na branch apk/main. Só os carros que você marcar
# como "canal de teste" no painel recebem este APK; os demais seguem na versão normal.
on:
  push:
    branches: [ shell-adb-do, fix-fifa-gta ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WORKER_BASE: https://euler-catalog.eulerfilhogontijodamata.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Unlock_BYD-teste.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Unlock_BYD-teste
          path: app/build/outputs/apk/debug/Unlock_BYD-teste.apk
          if-no-files-found: error

      - name: Publish APK to 'apk-teste' branch (git-reachable)
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/Unlock_BYD-teste.apk /tmp/out/Unlock_BYD-teste.apk
          cd /tmp/out
          git init -q
          git checkout -q -b apk-teste
          git config user.name "ci"
          git config user.email "ci@example.com"
          git add Unlock_BYD-teste.apk
          git commit -q -m "APK teste build ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk-teste

      - name: Publicar no R2 (canal de teste)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          set -e
          npm i -g wrangler@4
          VC=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts)
          echo "versionCode de teste: $VC"
          # 1) APK primeiro
          wrangler r2 object put "unlock-byd/app/Unlock_BYD-teste.apk" \
            --file app/build/outputs/apk/debug/Unlock_BYD-teste.apk --remote \
            --content-type application/vnd.android.package-archive
          # 2) ponteiro da versão de teste (o worker lê isto para os carros do canal de teste)
          printf '{"versionCode":%s,"url":"%s/f/app/Unlock_BYD-teste.apk"}' "$VC" "$WORKER_BASE" > app_version_test.json
          wrangler r2 object put "unlock-byd/app_version_test.json" \
            --file app_version_test.json --remote \
            --content-type "application/json; charset=utf-8"
