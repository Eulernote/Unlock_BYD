name: verificar-links
# Testa (HEAD) todos os links do catálogo publicado: APKs, ícones e extras.
on:
  workflow_dispatch:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - name: Testar links
        run: |
          python3 - <<'PY'
          import json, urllib.request
          S = "https://euler-catalog.eulerfilhogontijodamata.workers.dev"
          cat = json.load(urllib.request.urlopen(S + "/catalog.json"))
          def head(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, method="HEAD"), timeout=30)
                  return r.status, int(r.headers.get("Content-Length") or -1)
              except Exception as e:
                  return getattr(e, "code", str(e)), -1
          bad = 0
          for a in cat.get("apps", []):
              links = [("apk", a.get("url")), ("icon", a.get("icon")), ("lock", a.get("lock_url"))] + [("extra:" + x.get("destino", "download"), x.get("url")) for x in a.get("extras", [])]
              for kind, u in links:
                  if not u: continue
                  st, n = head(u)
                  ok = st == 200
                  bad += 0 if ok else 1
                  print(("OK  " if ok else "ERRO"), a["name"], kind, st, ("%.1f MB" % (n/1048576)) if n > 0 else "", u)
          print("links com erro:", bad)
          PY
