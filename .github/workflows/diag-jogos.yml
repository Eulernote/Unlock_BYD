name: diag-jogos
on:
  push:
    branches: [ diag ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Checar canal de teste
        run: |
          B=https://euler-catalog.eulerfilhogontijodamata.workers.dev
          echo "=== app_version.json (producao) ==="; curl -s "$B/app_version.json"; echo
          echo "=== app_version_test.json (canal de teste) ==="; curl -s "$B/f/app_version_test.json"; echo
          echo "=== HEAD do APK de teste ==="; curl -sI "$B/f/app/Unlock_BYD-teste.apk" | grep -iE "HTTP/|content-length|content-type"
          echo "=== versionCode no gradle da fix-fifa-gta (o que deveria estar publicado) ==="
          curl -s "https://raw.githubusercontent.com/Eulernote/Unlock_BYD/fix-fifa-gta/app/build.gradle.kts" | grep -i versioncode
