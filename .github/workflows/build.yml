name: build-apk
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Baixar modelo de voz (Vosk pt-BR) e embutir em assets
        run: |
          set -e
          curl -fsSL -o /tmp/vosk-pt.zip "https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip" \
            || curl -fsSL -o /tmp/vosk-pt.zip "https://huggingface.co/rhasspy/vosk-models/resolve/main/pt/vosk-model-small-pt-0.3.zip"
          mkdir -p /tmp/vosk-x
          unzip -q /tmp/vosk-pt.zip -d /tmp/vosk-x
          rm -rf app/src/main/assets/model-pt
          mkdir -p app/src/main/assets
          mv /tmp/vosk-x/vosk-model-small-pt-0.3 app/src/main/assets/model-pt
          echo "modelo embutido em assets/model-pt:"; ls -la app/src/main/assets/model-pt

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          # Nome padrão do APK: Unlock_BYD.apk
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Unlock_BYD.apk

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: Unlock_BYD
          path: app/build/outputs/apk/debug/Unlock_BYD.apk
          if-no-files-found: error

      - name: Publish APK to 'apk' branch (git-reachable)
        run: |
          mkdir -p /tmp/out
          cp app/build/outputs/apk/debug/Unlock_BYD.apk /tmp/out/Unlock_BYD.apk
          cd /tmp/out
          git init -q
          git checkout -q -b apk
          git config user.name "ci"
          git config user.email "ci@example.com"
          git add Unlock_BYD.apk
          git commit -q -m "APK build ${{ github.sha }}"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk
